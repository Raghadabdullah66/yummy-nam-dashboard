<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yummy Nam - Live Orders</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #fff7fb; color: #222; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; background: #e11d48; color: #fff; }
  header h1 { font-size: 20px; margin: 0; }
  .hbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 9px 14px; background: #fff; color: #e11d48; font-weight: 600; }
  button.ghost { background: transparent; color: #fff; border: 2px solid #fff; }
  button:disabled { opacity: .6; cursor: default; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .login { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .login label { display: block; font-size: 14px; margin-bottom: 10px; }
  .login input { width: 100%; padding: 12px; margin-top: 6px; border: 2px solid #f7b6d2; border-radius: 10px; font: inherit; }
  .login button { width: 100%; background: #e11d48; color: #fff; margin-top: 4px; }
  .err { color: #e11d48; min-height: 1.2em; margin: 8px 0 0; font-size: 14px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { font-size: 13px; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.07); border-top: 6px solid #f59e0b; }
  .card.preparing { border-color: #3b82f6; }
  .card.ready { border-color: #22c55e; }
  .card.completed { border-color: #9ca3af; opacity: .65; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .no { font-size: 20px; font-weight: 800; }
  .time { font-size: 12px; color: #666; }
  .cust { margin: 10px 0; font-size: 15px; line-height: 1.5; }
  .cust a { color: #e11d48; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
  .total { display: flex; justify-content: space-between; font-weight: 800; font-size: 17px; margin: 10px 0; }
  .status { display: flex; gap: 6px; flex-wrap: wrap; }
  .status button { background: #f3f4f6; color: #333; padding: 7px 10px; font-size: 13px; }
  .status button.on { background: #e11d48; color: #fff; }
  .acct { margin: 0 auto 18px; }
  .sec { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; font-size: 18px; }
  .status button.del { color: #e11d48; border-color: #e11d48; }
  .panel { background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.08); margin: 0 0 18px; }
  .panel h2 { margin: 0 0 12px; font-size: 20px; }
  .sub { font-size: 16px; margin: 22px 0 10px; }
  .mlist li { flex-wrap: wrap; align-items: center; }
  .mrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mrow img, .mrow .noimg { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: #fdf2f8; flex: none; }
  .mrow .minfo { flex: 1; min-width: 160px; display: flex; flex-direction: column; }
  .mrow .minfo span { color: #666; font-size: 14px; }
  .mrow.off { opacity: .55; }
  .mact { display: flex; gap: 6px; flex-wrap: wrap; }
  .mact button { padding: 7px 10px; font-size: 13px; background: #f3f4f6; color: #333; }
  .mact button.danger { background: #fff; color: #e11d48; border: 2px solid #e11d48; }
  .mform { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
  .mform label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
  .mform input[type=text], .mform input[type=number], .mform select { padding: 10px; border: 2px solid #f7b6d2; border-radius: 10px; font: inherit; }
  .mform label.chk { flex-direction: row; align-items: center; }
  .mform .fbtns, .mform .err { grid-column: 1 / -1; }
  .fbtns { display: flex; gap: 8px; }
  .fbtns button { background: #e11d48; color: #fff; }
  .fbtns button.ghost2 { background: #f3f4f6; color: #333; }
  .mform .days { grid-column: 1 / -1; border: 2px solid #f7b6d2; border-radius: 10px; display: flex; gap: 12px; flex-wrap: wrap; padding: 10px; margin: 0; }
  .mform .days label { flex-direction: row; align-items: center; gap: 4px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; max-width: 1100px; margin: 14px auto 0; padding: 0 16px; }
  .tabs button { background: #fff; color: #e11d48; border: 2px solid #f7b6d2; }
  .tabs button.on { background: #e11d48; color: #fff; border-color: #e11d48; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<section id="login" class="login hidden">
  <h2>Staff login</h2>
  <form id="loginForm">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<header id="top" class="hidden">
  <h1>Yummy Nam - Live Orders</h1>
  <div class="hbtns">
    <button id="soundBtn" type="button">Enable sound</button>
    <button id="notifBtn" type="button">Enable alerts</button>
    <button id="logoutBtn" type="button" class="ghost">Sign out</button>
  </div>
</header>

<nav id="tabs" class="tabs hidden">
  <button type="button" data-tab="orders" class="on">Orders</button>
  <button type="button" data-tab="menu">Menu &amp; hours</button>
  <button type="button" data-tab="account">Account</button>
</nav>

<main id="app" class="hidden">
  <section id="account" class="login acct hidden">
    <h2>Account</h2>
    <p class="pill" id="acctEmail"></p>
    <form id="acctForm">
      <label>Name<input id="acctName" type="text" autocomplete="name"></label>
      <label>New password (min 8 characters)<input id="newPw" type="password" autocomplete="new-password"></label>
      <label>Confirm new password<input id="newPw2" type="password" autocomplete="new-password"></label>
      <button type="submit">Save</button>
      <p class="err" id="acctErr"></p>
    </form>
  </section>

  <section id="menuPanel" class="panel hidden">
    <h2>Menu</h2>
    <ul id="menuList" class="mlist"></ul>

    <h3 class="sub" id="menuFormTitle">Add item</h3>
    <form id="menuForm" class="mform">
      <input type="hidden" id="mId">
      <label>Name (English)<input id="mName" type="text" maxlength="60" required></label>
      <label>Name (Arabic)<input id="mNameAr" type="text" maxlength="60"></label>
      <label>Category<select id="mCat"><option value="ramyun">Ramyun</option><option value="corndog">Corn dog</option></select></label>
      <label>Price (AED)<input id="mPrice" type="number" min="0" step="0.5" required></label>
      <label>Photo<input id="mImg" type="file" accept="image/*"></label>
      <label class="chk"><input id="mActive" type="checkbox" checked> Show on menu</label>
      <div class="fbtns">
        <button type="submit" id="mSave">Add item</button>
        <button type="button" id="mCancel" class="ghost2">Cancel</button>
      </div>
      <p class="err" id="mErr"></p>
    </form>

    <h3 class="sub">Order hours</h3>
    <form id="hoursForm" class="mform">
      <fieldset class="days">
        <legend>Open days</legend>
        <label><input type="checkbox" value="Sun"> Sun</label>
        <label><input type="checkbox" value="Mon"> Mon</label>
        <label><input type="checkbox" value="Tue"> Tue</label>
        <label><input type="checkbox" value="Wed"> Wed</label>
        <label><input type="checkbox" value="Thu"> Thu</label>
        <label><input type="checkbox" value="Fri"> Fri</label>
        <label><input type="checkbox" value="Sat"> Sat</label>
      </fieldset>
      <label>Opens (UAE time)<select id="hOpen"></select></label>
      <label>Closes (UAE time)<select id="hClose"></select></label>
      <div class="fbtns"><button type="submit">Save hours</button></div>
      <p class="err" id="hErr"></p>
    </form>
  </section>

  <div id="ordersSec">
  <div class="bar">
    <span class="pill" id="liveState">Connecting...</span>
    <span class="pill" id="count"></span>
  </div>
  <div id="orders" class="grid"></div>

  <h2 class="sec">Ready / completed <span class="pill" id="doneCount"></span></h2>
  <div id="doneOrders" class="grid"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  var STATUSES = ['new', 'preparing', 'ready', 'completed'];
  var cfg = window.YUMMY_SUPABASE || {};
  var configured = !!(window.supabase && cfg.url && cfg.url.indexOf('YOUR-') === -1);
  var sb = null, channel = null, orders = [], menuItems = [], audioCtx = null, beepEl = null, soundOn = false;

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return Number(n).toFixed(2) + ' AED'; }
  function when(iso) { return new Date(iso).toLocaleString(); }

  function showLogin() {
    $('login').classList.remove('hidden');
    $('top').classList.add('hidden');
    $('tabs').classList.add('hidden');
    $('app').classList.add('hidden');
    $('account').classList.add('hidden');
    $('menuPanel').classList.add('hidden');
  }
  function showApp() {
    $('login').classList.add('hidden');
    $('top').classList.remove('hidden');
    $('tabs').classList.remove('hidden');
    $('app').classList.remove('hidden');
    showTab('orders');
  }

  function showTab(name) {
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.tab === name);
    });
    $('ordersSec').classList.toggle('hidden', name !== 'orders');
    $('menuPanel').classList.toggle('hidden', name !== 'menu');
    $('account').classList.toggle('hidden', name !== 'account');
    if (name === 'menu') { loadMenu(); loadHours(); }
    if (name === 'account') loadAccount();
  }

  function cards(list, canDelete) {
    return list.map(function (o) {
      var items = (o.items || []).map(function (it) {
        return '<li><span>' + esc(it.name) + (it.spice ? ' (' + esc(it.spice) + ')' : '') +
               ' x ' + esc(it.qty) + '</span><span>' + money(it.line_total) + '</span></li>';
      }).join('');
      var btns = STATUSES.map(function (s) {
        return '<button type="button" data-id="' + esc(o.id) + '" data-status="' + s + '"' +
               (o.status === s ? ' class="on"' : '') + '>' + s + '</button>';
      }).join('');
      return '<article class="card ' + esc(o.status) + '">' +
        '<div class="top"><span class="no">#' + esc(o.order_number) + '</span>' +
        '<span class="time">' + esc(when(o.created_at)) + '</span></div>' +
        '<div class="cust"><strong>' + esc(o.customer_name) + '</strong><br>' +
        '<a href="tel:' + esc(o.customer_phone) + '">' + esc(o.customer_phone) + '</a></div>' +
        '<ul>' + items + '</ul>' +
        '<div class="total"><span>Total</span><span>' + money(o.total) + '</span></div>' +
        '<div class="status">' + btns +
        (canDelete ? '<button type="button" class="ghost del" data-del="' + esc(o.id) + '">Delete</button>' : '') +
        '</div>' +
        '</article>';
    }).join('');
  }

  function render() {
    var active = orders.filter(function (o) { return o.status === 'new' || o.status === 'preparing'; });
    var done = orders.filter(function (o) { return o.status === 'ready' || o.status === 'completed'; });
    $('count').textContent = active.length + ' active';
    $('doneCount').textContent = done.length;
    $('orders').innerHTML = cards(active, false) || '<p>No active orders.</p>';
    $('doneOrders').innerHTML = cards(done, true) || '<p>No completed orders yet.</p>';
  }

  function upsert(row, isNew) {
    var i = orders.findIndex(function (o) { return o.id === row.id; });
    if (i >= 0) orders[i] = row; else orders.unshift(row);
    render();
    if (isNew) alertNew(row);
  }

  function removeOrder(id) {
    orders = orders.filter(function (o) { return o.id !== id; });
    render();
  }

  // iOS Safari only lets audio start later if it was unlocked by a tap; reuse one <audio> element for that
  function makeBeepUrl() {
    var rate = 8000, len = Math.floor(rate * 0.8), buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
    function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, len * 2, true);
    for (var n = 0; n < len; n++) {
      var t = n / rate, on = (t % 0.25) < 0.2;
      var s = on ? Math.sin(2 * Math.PI * 880 * t) * 0.6 : 0;
      v.setInt16(44 + n * 2, Math.round(s * 32767), true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  function playBeep() {
    if (!soundOn) return;
    if (beepEl) {
      beepEl.currentTime = 0;
      beepEl.play().catch(function () { /* blocked until next tap */ });
      return;
    }
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [0, 0.25, 0.5].forEach(function (t) {
      var now = audioCtx.currentTime + t;
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.22);
    });
  }

  function alertNew(row) {
    playBeep();
    if ('Notification' in window && Notification.permission === 'granted') {
      var title = 'New order #' + row.order_number;
      var opts = {
        body: row.customer_name + ' - ' + money(row.total),
        tag: 'order-' + row.id,
        vibrate: [200, 100, 200]
      };
      // Android Chrome only supports notifications via the service worker
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(function (reg) {
          reg.showNotification(title, opts);
        }).catch(function () { /* notifications unavailable */ });
      } else {
        try { new Notification(title, opts); } catch (e) { /* notifications unavailable */ }
      }
    }
  }

  // Phones suspend audio and drop realtime when the screen locks or the tab is hidden
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !sb || $('app').classList.contains('hidden')) return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    loadOrders();
    if (channel && channel.state !== 'joined') {
      sb.removeChannel(channel);
      channel = null;
      subscribe();
    }
  });

  function subscribe() {
    if (channel) return;
    channel = sb.channel('orders-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' },
        function (p) { upsert(p.new, true); })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' },
        function (p) { upsert(p.new, false); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'orders' },
        function (p) { removeOrder(p.old.id); })
      .subscribe(function (status) {
        $('liveState').textContent = status === 'SUBSCRIBED' ? 'Live' : 'Status: ' + status;
      });
  }

  async function loadOrders() {
    var r = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(200);
    if (r.error) { alert('Could not load orders: ' + r.error.message); return; }
    orders = r.data || [];
    render();
  }

  async function enter() {
    var r = await sb.rpc('is_admin');
    if (r.error || r.data !== true) {
      await sb.auth.signOut();
      showLogin();
      $('loginErr').textContent = 'This account is not allowed to view orders.';
      return;
    }
    showApp();
    await loadOrders();
    subscribe();
  }

  async function setStatus(id, status) {
    var r = await sb.from('orders').update({ status: status }).eq('id', id).select().single();
    if (r.error) { alert('Could not update status: ' + r.error.message); return; }
    upsert(r.data, false);
  }

  async function deleteOrder(id) {
    if (!confirm('Delete this order permanently?')) return;
    var r = await sb.from('orders').delete().eq('id', id).select();
    if (r.error) { alert('Could not delete order: ' + r.error.message); return; }
    if (!r.data || r.data.length === 0) { alert('Order was not deleted. Check admin permissions.'); return; }
    removeOrder(id);
  }

  document.addEventListener('click', function (e) {
    var d = e.target.closest('button[data-del]');
    if (d) { deleteOrder(d.dataset.del); return; }
    var b = e.target.closest('button[data-id]');
    if (b) setStatus(b.dataset.id, b.dataset.status);
  });

  $('soundBtn').onclick = function () {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    if (!beepEl) {
      beepEl = new Audio(makeBeepUrl());
      beepEl.play().catch(function () { beepEl = null; });
    } else {
      playBeep();
    }
    soundOn = true;
    $('soundBtn').textContent = 'Sound on';
  };

  $('notifBtn').onclick = function () {
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(function (p) {
      $('notifBtn').textContent = p === 'granted' ? 'Alerts on' : 'Alerts blocked';
    });
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
  }

  $('loginForm').onsubmit = async function (e) {
    e.preventDefault();
    $('loginErr').textContent = '';
    if (!sb) { $('loginErr').textContent = 'Setup needed: fill in supabase-config.js.'; return; }
    var r = await sb.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    $('password').value = '';
    if (r.error) { $('loginErr').textContent = 'Wrong email or password.'; return; }
    await enter();
  };

  async function loadAccount() {
    var r = await sb.auth.getUser();
    var u = r.data && r.data.user;
    $('acctEmail').textContent = u ? u.email : '';
    $('acctName').value = (u && u.user_metadata && u.user_metadata.name) || '';
    $('acctErr').textContent = '';
  }

  $('acctForm').onsubmit = async function (e) {
    e.preventDefault();
    var p = $('newPw').value, p2 = $('newPw2').value, err = '';
    if (p && p.length < 8) err = 'Password must be at least 8 characters.';
    else if (p !== p2) err = 'Passwords do not match.';
    if (err) { $('acctErr').textContent = err; return; }
    var attrs = { data: { name: $('acctName').value.trim() } };
    if (p) attrs.password = p;
    var r = await sb.auth.updateUser(attrs);
    if (r.error) { $('acctErr').textContent = r.error.message; return; }
    $('newPw').value = '';
    $('newPw2').value = '';
    $('acctErr').textContent = 'Saved.';
  };

  $('logoutBtn').onclick = async function () {
    if (channel) { await sb.removeChannel(channel); channel = null; }
    await sb.auth.signOut();
    orders = [];
    showLogin();
  };

  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
  }

  function findMenu(id) {
    return menuItems.find(function (m) { return m.id === id; });
  }

  async function loadMenu() {
    var r = await sb.from('menu_items').select('*').order('sort_order', { ascending: true }).order('name', { ascending: true });
    if (r.error) { alert('Could not load menu: ' + r.error.message); return; }
    menuItems = r.data || [];
    renderMenuList();
  }

  function renderMenuList() {
    $('menuList').innerHTML = menuItems.map(function (m) {
      return '<li class="mrow' + (m.active ? '' : ' off') + '">' +
        (m.img ? '<img src="' + esc(m.img) + '" alt="">' : '<span class="noimg"></span>') +
        '<div class="minfo"><strong>' + esc(m.name) + '</strong>' +
        '<span>' + esc(m.name_ar || '') + ' · ' + (m.category === 'corndog' ? 'Corn dog' : 'Ramyun') +
        ' · ' + money(m.price) + (m.active ? '' : ' · hidden') + '</span></div>' +
        '<div class="mact">' +
        '<button type="button" data-mtoggle="' + esc(m.id) + '">' + (m.active ? 'Hide' : 'Show') + '</button>' +
        '<button type="button" data-medit="' + esc(m.id) + '">Edit</button>' +
        '<button type="button" class="danger" data-mdel="' + esc(m.id) + '">Delete</button>' +
        '</div></li>';
    }).join('') || '<li>No items yet.</li>';
  }

  function resetMenuForm() {
    $('menuForm').reset();
    $('mId').value = '';
    $('mActive').checked = true;
    $('menuFormTitle').textContent = 'Add item';
    $('mSave').textContent = 'Add item';
    $('mErr').textContent = '';
  }

  function editMenu(id) {
    var m = findMenu(id);
    if (!m) return;
    $('mId').value = m.id;
    $('mName').value = m.name;
    $('mNameAr').value = m.name_ar || '';
    $('mCat').value = m.category;
    $('mPrice').value = m.price;
    $('mActive').checked = m.active;
    $('mImg').value = '';
    $('menuFormTitle').textContent = 'Edit item (leave photo empty to keep current)';
    $('mSave').textContent = 'Save changes';
    $('mErr').textContent = '';
    $('mName').focus();
  }

  $('mCancel').onclick = resetMenuForm;

  $('menuForm').onsubmit = async function (e) {
    e.preventDefault();
    var id = $('mId').value, existing = id ? findMenu(id) : null;
    var file = $('mImg').files[0], price = Number($('mPrice').value), err = '';
    if (!$('mName').value.trim()) err = 'Enter a name.';
    else if (!(price >= 0)) err = 'Enter a valid price.';
    else if (!existing && !file) err = 'Choose a photo for the new item.';
    if (err) { $('mErr').textContent = err; return; }

    $('mSave').disabled = true;
    try {
      var img = existing ? existing.img : null;
      if (file) {
        var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        var path = slugify($('mName').value) + '-' + Date.now() + '.' + ext;
        var up = await sb.storage.from('menu-images').upload(path, file, { contentType: file.type, upsert: false });
        if (up.error) throw new Error('Photo upload failed: ' + up.error.message);
        img = sb.storage.from('menu-images').getPublicUrl(path).data.publicUrl;
      }
      var row = {
        name: $('mName').value.trim(),
        name_ar: $('mNameAr').value.trim() || null,
        category: $('mCat').value,
        price: price,
        active: $('mActive').checked,
        img: img
      };
      var r;
      if (existing) {
        r = await sb.from('menu_items').update(row).eq('id', id).select();
      } else {
        var maxOrder = menuItems.reduce(function (mx, m) { return Math.max(mx, m.sort_order || 0); }, 0);
        row.id = slugify($('mName').value) + '-' + Date.now().toString(36);
        row.sort_order = maxOrder + 10;
        r = await sb.from('menu_items').insert(row).select();
      }
      if (r.error) throw new Error(r.error.message);
      if (!r.data || r.data.length === 0) throw new Error('Not saved. Check admin permissions.');
      resetMenuForm();
      await loadMenu();
    } catch (ex) {
      $('mErr').textContent = ex.message;
    } finally {
      $('mSave').disabled = false;
    }
  };

  $('menuList').onclick = async function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.medit) { editMenu(b.dataset.medit); return; }
    if (b.dataset.mtoggle) {
      var m = findMenu(b.dataset.mtoggle);
      var t = await sb.from('menu_items').update({ active: !m.active }).eq('id', m.id).select();
      if (t.error) { alert('Could not update item: ' + t.error.message); return; }
      if (!t.data || t.data.length === 0) { alert('Item was not updated. Check admin permissions.'); return; }
      await loadMenu();
      return;
    }
    if (b.dataset.mdel) {
      if (!confirm('Delete this item from the menu? Past orders are not affected.')) return;
      var d = await sb.from('menu_items').delete().eq('id', b.dataset.mdel).select();
      if (d.error) { alert('Could not delete item: ' + d.error.message); return; }
      if (!d.data || d.data.length === 0) { alert('Item was not deleted. Check admin permissions.'); return; }
      if ($('mId').value === b.dataset.mdel) resetMenuForm();
      await loadMenu();
    }
  };

  function fillHourSelects() {
    var opts = '';
    for (var h = 0; h < 24; h++) {
      opts += '<option value="' + h + '">' + (h % 12 || 12) + ':00 ' + (h < 12 ? 'AM' : 'PM') + '</option>';
    }
    $('hOpen').innerHTML = opts;
    $('hClose').innerHTML = opts;
  }

  async function loadHours() {
    var r = await sb.from('settings').select('key,value');
    if (r.error) { $('hErr').textContent = r.error.message; return; }
    var s = {};
    (r.data || []).forEach(function (x) { s[x.key] = x.value; });
    var days = (s.order_days || '').split(',');
    document.querySelectorAll('#hoursForm .days input').forEach(function (cb) {
      cb.checked = days.indexOf(cb.value) !== -1;
    });
    $('hOpen').value = s.order_open_hour || '18';
    $('hClose').value = s.order_close_hour || '21';
    $('hErr').textContent = '';
  }

  $('hoursForm').onsubmit = async function (e) {
    e.preventDefault();
    var days = [];
    document.querySelectorAll('#hoursForm .days input').forEach(function (cb) {
      if (cb.checked) days.push(cb.value);
    });
    var open = Number($('hOpen').value), close = Number($('hClose').value);
    if (!days.length) { $('hErr').textContent = 'Choose at least one open day.'; return; }
    if (close <= open) { $('hErr').textContent = 'Closing time must be after opening time.'; return; }
    var r = await sb.from('settings').upsert([
      { key: 'order_days', value: days.join(',') },
      { key: 'order_open_hour', value: String(open) },
      { key: 'order_close_hour', value: String(close) }
    ], { onConflict: 'key' }).select();
    if (r.error) { $('hErr').textContent = r.error.message; return; }
    if (!r.data || r.data.length !== 3) { $('hErr').textContent = 'Not saved. Check admin permissions.'; return; }
    $('hErr').textContent = 'Saved.';
  };

  $('tabs').onclick = function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) showTab(b.dataset.tab);
  };

  fillHourSelects();

  if (!configured) {
    showLogin();
    $('loginErr').textContent = 'Setup needed: fill in supabase-config.js.';
    return;
  }

  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) enter(); else showLogin();
  });
})();
</script>
</body>
</html>
